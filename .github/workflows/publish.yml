name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make sure the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Make sure the tag agrees with package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm tophat:all

      # Trusted publishing needs npm 11.5.1 or later. prepack builds dist/. npm adds provenance when the repository is public.
      - name: Publish to npm
        run: |
          npm install -g npm@latest
          npm publish
