name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:all
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      - name: Keep the page test screenshots when a check fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: page-tests
          path: build/page
